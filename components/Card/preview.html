<!-- @dsCard group="Exibição" height=340 subtitle="Card de plano" -->
<div style="padding:var(--s-6);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s-4);background:var(--bg)">
  <div class="card"><div style="height:8px;background:var(--uni-roxo)"></div><div style="padding:var(--s-6)">
    <h3 style="font-size:22px;font-weight:600;color:var(--uni-vinho-escuro);margin:0 0 8px">Essencial</h3>
    <div style="font-size:44px;font-weight:600;color:var(--uni-vinho-escuro);letter-spacing:-0.02em;line-height:1">R$ 49<span style="font-size:14px;color:var(--text-muted);font-weight:400">/mês</span></div>
    <p style="font-size:14px;color:var(--text-muted);margin-top:16px;line-height:1.55">Cobertura completa de urgência e prevenção.</p>
    <button class="btn secondary md" style="width:100%;margin-top:16px">Contratar</button></div></div>
  <div class="card" style="border-color:var(--uni-vinho-escuro);border-width:2px"><div style="height:8px;background:var(--uni-pessego)"></div><div style="padding:var(--s-6)">
    <span class="badge brand" style="margin-bottom:12px">Mais escolhido</span>
    <h3 style="font-size:22px;font-weight:600;color:var(--uni-vinho-escuro);margin:0 0 8px">Clássico</h3>
    <div style="font-size:44px;font-weight:600;color:var(--uni-vinho-escuro);letter-spacing:-0.02em;line-height:1">R$ 89<span style="font-size:14px;color:var(--text-muted);font-weight:400">/mês</span></div>
    <p style="font-size:14px;color:var(--text-muted);margin-top:16px;line-height:1.55">Consultas, limpezas e tratamentos restauradores.</p>
    <button class="btn primary md" style="width:100%;margin-top:16px">Contratar</button></div></div>
  <div class="card"><div style="height:8px;background:var(--uni-ciano)"></div><div style="padding:var(--s-6)">
    <h3 style="font-size:22px;font-weight:600;color:var(--uni-vinho-escuro);margin:0 0 8px">Premium</h3>
    <div style="font-size:44px;font-weight:600;color:var(--uni-vinho-escuro);letter-spacing:-0.02em;line-height:1">R$ 149<span style="font-size:14px;color:var(--text-muted);font-weight:400">/mês</span></div>
    <p style="font-size:14px;color:var(--text-muted);margin-top:16px;line-height:1.55">Inclui ortodontia, próteses e estética.</p>
    <button class="btn secondary md" style="width:100%;margin-top:16px">Contratar</button></div></div>
</div>
<script></script>
